# renovate: datasource=github-releases depName=jdx/mise
min_version = "2026.11.8"

[tools]
actionlint = "1.7.12"
dprint = "0.64.3"
gitleaks = "8.30.1"
lefthook = "2.2.2"
"pipx:checkov" = "3.4.5"
"pipx:yamllint" = "1.38.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
trivy = "0.76.2"
uv = "0.13.8"
yamlfmt = "0.21.0"
zizmor = "1.32.0"

[settings]
# Install Python from .python-version, its single source (#246). The file holds
# major.minor, so mise installs that minor's latest patch.
idiomatic_version_file_enable_tools = ["python"]
