---
name: Generate Index

# INDEX.md and the README index block are generated from .apm/ by
# scripts/generate-index.sh (lefthook regenerates them on pre-commit).
#
# - Pull requests: read-only check that fails when the index is stale. It never
#   pushes to the PR branch: a `[skip ci]` / GITHUB_TOKEN commit would leave the
#   new head without check runs, so required checks would stay pending (#219).
# - main / manual runs: regenerate and push the refreshed index as a fallback.

on:
  push:
    branches:
      - main
    paths:
      - '.apm/prompts/**'
      - '.apm/instructions/**'
      - '.apm/skills/**'
      - '.apm/agents/**'
      - '.github/prompts/**/*.md'
      - '.github/agents/**/*.md'
  pull_request:
    paths:
      - '.apm/prompts/**'
      - '.apm/instructions/**'
      - '.apm/skills/**'
      - '.apm/agents/**'
      - '.github/prompts/**/*.md'
      - '.github/agents/**/*.md'
      - 'INDEX.md'
      - 'README.md'
      - 'scripts/generate-index.sh'
      - 'scripts/check-index.sh'
      - '.github/workflows/generate-index.yml'
  workflow_dispatch:

permissions: {}

jobs:
  check-index:
    name: Check index
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check index is up to date
        run: bash scripts/check-index.sh

  generate-index:
    name: Generate Index
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate index
        run: |
          bash scripts/generate-index.sh

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code INDEX.md README.md || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |-
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add INDEX.md README.md
          git commit -m "docs: Update index [skip ci]"
          branch="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
