---
name: Windows Hooks

# Run the lefthook pre-commit suite natively on Windows (Git for Windows sh, no
# WSL) so a Windows-only hook regression fails the PR (#229). Path-filtered to
# what the hooks execute, to keep runner minutes low.

on:
  push:
    branches:
      - main
    paths:
      - '.lefthook.toml'
      - '.mise.toml'
      - '.python-version'
      - 'scripts/**'
      - 'tests/**'
      - '.apm/skills/*/scripts/**'
      - '.github/workflows/windows-hooks.yml'
  pull_request:
    paths:
      - '.lefthook.toml'
      - '.mise.toml'
      - '.python-version'
      - 'scripts/**'
      - 'tests/**'
      - '.apm/skills/*/scripts/**'
      - '.github/workflows/windows-hooks.yml'

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit Hooks (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # Windows runners default to core.autocrlf=true; CRLF breaks the shell hooks.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python comes from .python-version via .mise.toml, as for contributors, and
      # scripts/py.sh picks mise's Python first (#246); test_py_launcher.py fails
      # if this step stops installing it.
      - name: Install lefthook and Python
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.11.8"
          install_args: lefthook python

      - name: Run pre-commit hooks
        run: '& (mise which lefthook) run pre-commit --all-files'
