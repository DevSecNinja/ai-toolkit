---
name: Markdown Validation

on:
  push:
    branches:
      - main
    paths:
      - '.apm/prompts/**/*.prompt.md'
      - '.apm/skills/**'
      - '.github/prompts/**/*.md'
      - 'tests/**'
      - 'scripts/generate-index.sh'
      - 'scripts/apply-apm-overrides.py'
      - 'apm.yml'
      - 'apm-overrides.json'
      - '.github/agents/**'
      - 'apm.lock.yaml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - '.github/workflows/markdown-validation.yml'
  pull_request:
    paths:
      - '.apm/prompts/**/*.prompt.md'
      - '.apm/skills/**'
      - '.github/prompts/**/*.md'
      - 'tests/**'
      - 'scripts/generate-index.sh'
      - 'scripts/apply-apm-overrides.py'
      - 'apm.yml'
      - 'apm-overrides.json'
      - '.github/agents/**'
      - 'apm.lock.yaml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - '.github/workflows/markdown-validation.yml'

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint markdown files
        continue-on-error: true
        uses: articulate/actions-markdownlint@17b8abe7407cd17590c006ecc837c35e1ac3ed83 # v1.1.0
        with:
          config: .markdownlint.json
          files: '**/*.md'
          ignore: node_modules

  validate-structure:
    name: Validate Prompt Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run validation script
        run: |-
          bash tests/validate-prompts.sh

      - name: Test Renovate helper with offline fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_renovate_prs.py' -v

      - name: Check release-please can bump apm.yml
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_release_please_config.py' -v

      - name: Check apm.yml does not depend on itself
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_apm_manifest.py' -v

      - name: Check vendored primitives keep their local overrides
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_apm_overrides.py' -v

  consumer-install:
    name: Check Consumer Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install apm CLI
        env:
          # Keep in step with apm-materialize.yml and the consumers' pin.
          # renovate: datasource=pypi depName=apm-cli
          apm_cli_version: "0.35.0"
        run: |
          python3 -m pip install --user "apm-cli==${apm_cli_version}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install this commit as a consumer would
        env:
          # APM fetches dependencies over the GitHub API, which needs a token.
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tests/check-consumer-install.sh "${REPO}" "${REF}"
