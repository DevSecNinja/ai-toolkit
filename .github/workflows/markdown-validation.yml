---
name: Markdown Validation

on:
  push:
    branches:
      - main
    paths:
      - '.apm/prompts/**/*.prompt.md'
      - '.apm/skills/**'
      - '.github/prompts/**/*.md'
      - 'tests/**'
      - 'scripts/generate-index.sh'
      - 'scripts/py.sh'
      - '.python-version'
      - '.mise.toml'
      - '.github/workflows/windows-hooks.yml'
      - 'scripts/apply-apm-overrides.py'
      - 'scripts/apm-external-skills.py'
      - '.agents/skills/**'
      - 'scripts/scan-skills.py'
      - 'apm.yml'
      - 'apm-overrides.json'
      - '.github/agents/**'
      - 'apm.lock.yaml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - '.github/workflows/markdown-validation.yml'
  pull_request:
    paths:
      - '.apm/prompts/**/*.prompt.md'
      - '.apm/skills/**'
      - '.github/prompts/**/*.md'
      - 'tests/**'
      - 'scripts/generate-index.sh'
      - 'scripts/py.sh'
      - '.python-version'
      - '.mise.toml'
      - '.github/workflows/windows-hooks.yml'
      - 'scripts/apply-apm-overrides.py'
      - 'scripts/apm-external-skills.py'
      - '.agents/skills/**'
      - 'scripts/scan-skills.py'
      - 'apm.yml'
      - 'apm-overrides.json'
      - '.github/agents/**'
      - 'apm.lock.yaml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - '.github/workflows/markdown-validation.yml'

permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate Prompt Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Test with the Python the hooks use (#246), not ubuntu-latest's python3.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Run validation script
        run: |-
          bash tests/validate-prompts.sh

      - name: Test the hooks' Python launcher
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_py_launcher.py' -v

      - name: Test Renovate helper with offline fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_renovate_prs.py' -v

      - name: Check release-please can bump apm.yml
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_release_please_config.py' -v

      - name: Check apm.yml does not depend on itself
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_apm_manifest.py' -v

      - name: Check vendored primitives keep their local overrides
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_apm_overrides.py' -v

      - name: Check external primitives match apm.lock.yaml
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_apm_external_skills.py' -v

      - name: Check no locked external file is dropped against the PR base
        # HEAD already holds this PR's lock, so compare with the base revision.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |-
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          python3 scripts/apm-external-skills.py check --base "${BASE_SHA}"

      - name: Check test fixtures leave a commit hook's repo alone
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_hook_git_env.py' -v

      - name: Test SkillSpector gate and report
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_skillspector*.py' -v

  consumer-install:
    name: Check Consumer Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install apm CLI
        env:
          # Keep in step with apm-materialize.yml and the consumers' pin.
          # renovate: datasource=pypi depName=apm-cli
          apm_cli_version: "0.35.0"
        run: |
          python3 -m pip install --user "apm-cli==${apm_cli_version}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install this commit as a consumer would
        env:
          # APM fetches dependencies over the GitHub API, which needs a token.
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tests/check-consumer-install.sh "${REPO}" "${REF}"
