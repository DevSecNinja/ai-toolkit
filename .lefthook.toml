# Git hooks managed by lefthook (https://lefthook.dev).
# Mirrors the repo's CI quality gates so issues are caught before they reach CI.
# lefthook is pinned in .mise.toml; install the hooks with:
#   mise exec -- lefthook install

[pre-commit]
parallel = false

# Must-pass gate: every .apm/ primitive and repo-local prompt is well-formed.
[pre-commit.commands.validate-prompts]
run = "bash tests/validate-prompts.sh"

[pre-commit.commands.renovate-helper]
run = "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_renovate_prs.py'"

# release-please must be able to bump apm.yml's version (see #204).
[pre-commit.commands.release-please-config]
run = "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_release_please_config.py'"

# apm.yml must not list ai-toolkit as its own dependency (see #207).
[pre-commit.commands.apm-manifest]
run = "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_apm_manifest.py'"

# Vendored agents must keep their apm-overrides.json pins (see #210).
[pre-commit.commands.apm-overrides]
run = "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_apm_overrides.py'"

# SkillSpector gate: severity policy, report contract and reviewed acceptances.
[pre-commit.commands.skillspector-gate]
run = "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_skillspector.py'"

# Regenerate INDEX.md / README index from .apm/ and re-stage the result, so the
# generated index never drifts from the primitives (the common contributor miss).
[pre-commit.commands.generate-index]
run = "bash scripts/generate-index.sh"
glob = [".apm/prompts/*.prompt.md", ".apm/instructions/*.instructions.md", ".apm/skills/**", ".apm/agents/*.agent.md"]
stage_fixed = true
