# Git hooks managed by lefthook (https://lefthook.dev).
# Mirrors the repo's CI quality gates so issues are caught before they reach CI.
# lefthook is pinned in .mise.toml; install the hooks with:
#   mise exec -- lefthook install

[pre-commit]
parallel = false

# Must-pass gate: every .apm/ primitive and repo-local prompt is well-formed.
[pre-commit.commands.validate-prompts]
run = "bash tests/validate-prompts.sh"

# Python hooks go through scripts/py.sh, which runs the .python-version Python
# that mise installs, or another new enough one, on Linux, macOS and native
# Windows (skipping the Microsoft Store python3 stub; #229, #246).
[pre-commit.commands.py-launcher]
run = "PYTHONDONTWRITEBYTECODE=1 sh scripts/py.sh -m unittest discover -s tests -p 'test_py_launcher.py'"

[pre-commit.commands.renovate-helper]
run = "PYTHONDONTWRITEBYTECODE=1 sh scripts/py.sh -m unittest discover -s tests -p 'test_renovate_prs.py'"

# release-please must be able to bump apm.yml's version (see #204).
[pre-commit.commands.release-please-config]
run = "PYTHONDONTWRITEBYTECODE=1 sh scripts/py.sh -m unittest discover -s tests -p 'test_release_please_config.py'"

# apm.yml must not list ai-toolkit as its own dependency (see #207).
[pre-commit.commands.apm-manifest]
run = "PYTHONDONTWRITEBYTECODE=1 sh scripts/py.sh -m unittest discover -s tests -p 'test_apm_manifest.py'"

# Vendored agents must keep their apm-overrides.json pins (see #210).
[pre-commit.commands.apm-overrides]
run = "PYTHONDONTWRITEBYTECODE=1 sh scripts/py.sh -m unittest discover -s tests -p 'test_apm_overrides.py'"

# Every locked dependency must still deploy its files (see #237).
[pre-commit.commands.apm-external-skills]
run = "PYTHONDONTWRITEBYTECODE=1 sh scripts/py.sh -m unittest discover -s tests -p 'test_apm_external_skills.py'"

# Fixture repos must not touch the repo a commit hook points at (core.bare; #251).
[pre-commit.commands.hook-git-env]
run = "PYTHONDONTWRITEBYTECODE=1 sh scripts/py.sh -m unittest discover -s tests -p 'test_hook_git_env.py'"

# SkillSpector gate and report: severity policy, reviewed acceptances, run summary and SARIF.
[pre-commit.commands.skillspector-gate]
run = "PYTHONDONTWRITEBYTECODE=1 sh scripts/py.sh -m unittest discover -s tests -p 'test_skillspector*.py'"

# Regenerate INDEX.md / README index from the staged tree and stage only the
# result, so the committed index never drifts from the primitives (the common
# contributor miss). CI fails a PR with a stale index instead of pushing a
# fix-up commit (#219). No glob: the script filters staged paths itself, so
# deletions (which lefthook's glob filter drops) still refresh the index.
[pre-commit.commands.generate-index]
run = "bash scripts/stage-index.sh"
